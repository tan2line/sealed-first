name: Fetch launch video
on:
  push:
    paths: [".github/workflows/fetch-launch-video.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download rendered video
        env:
          VIDEO_URL: "https://files2.heygen.ai/aries/output/7dee3c99-ba20-4765-8f89-91027b0b0343/video.mp4?Expires=1792346879&Signature=lThfzXGQ~3jQRtYTVBZCGVa1jpiwTHjbDil6aKWgcMQBYOSP15GD0CHlMrW2TKQnvIWtrq0FGxF45Hr0Y7xQTp78DtCCVpm-0XoTw1UoijRZicUb8leG1yKRxgaYyCszgOgKX1Ir3X0iVMV80T6JFQMBrypfnpFE3WTSVy-2cB2b0nXkYNEeSdFwffWxJ9-z4j4IlVhiol~YsrKUj-uDgfLY8uSliS1DXYcPcB6AXlK6yB~uPyWublFL9VKIJ-5JERyWnfNzDZMcSswaJX-~8KvPsKALCzPbUxy582AkrsJ7HUQpjOaMcWbSW6ERMvxXk9vOfTHMCV5ChxaQZynx8w__&Key-Pair-Id=K38HBHX5LX3X2H"
        run: |
          mkdir -p site/media
          curl -fsSL -o site/media/sealed-first-launch.mp4 "$VIDEO_URL"
          ls -la site/media
      - name: Commit video and remove this workflow
        run: |
          git config user.name "Andrew Plummer"
          git config user.email "drplummer@gmail.com"
          git rm -q .github/workflows/fetch-launch-video.yml
          git add site/media/sealed-first-launch.mp4
          git commit -m "Add launch video"
          git push
